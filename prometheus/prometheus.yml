global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
  - job_name: node
    static_configs:
      - targets:
          - 192.168.50.10:9100
        labels:
          instance: lab-app-01

      - targets:
          - 192.168.50.20:9100
        labels:
          instance: lab-devops-01

      - targets:
          - 192.168.50.30:9100
        labels:
          instance: monitoring

  - job_name: cadvisor
    static_configs:
      - targets:
          - 192.168.50.10:8080
        labels:
          instance: lab-app-01
