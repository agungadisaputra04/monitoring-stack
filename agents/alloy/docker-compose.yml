services:
  alloy:
    image: grafana/alloy:v1.11.2
    container_name: monitoring-alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy

    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "12345:12345"