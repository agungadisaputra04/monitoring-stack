services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.57.0
    container_name: monitoring-cadvisor
    restart: unless-stopped

    privileged: true

    devices:
      - /dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    ports:
      - "8080:8080"
